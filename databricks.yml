# Databricks Asset Bundle: the jobs, schedule, alerting and guard rails as code.
#
# Production is deployed by GitHub Actions (.github/workflows/cd.yml) as a service principal.
# Manual use, e.g. a personal dev copy:
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run      -t dev registry_lakehouse
#
# Environment-specific values (volumes, e-mail, service principal) are passed as BUNDLE_VAR_<name>
# environment variables (GitHub environment variables in CD), so they never live in this public repo.

bundle:
  name: eu-company-registry-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the bronze/silver/gold/ops schemas
    default: registry_dev
  landing_root:
    description: Landing location, an external UC volume over the S3 landing prefix
    default: /Volumes/${var.catalog}/files/landing
  publish_root:
    description: Where the static website JSON is written, an external UC volume over the site's S3 prefix
    default: /Volumes/${var.catalog}/files/site_data
  alert_email:
    description: Recipient of failure / duration alerts
  secret_scope:
    description: Databricks secret scope holding alert-webhook and pseudonym-key
    default: registry-lakehouse
  pause_status:
    description: Schedule state. Dev stays paused so nothing runs (or costs) by accident
    default: PAUSED
  service_principal_id:
    description: Application id of the service principal that owns and runs the production job
    default: ""

artifacts:
  registry_wheel:
    type: whl
    build: python -m pip wheel --no-deps --wheel-dir dist .
    path: .

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: registry_dev
      pause_status: PAUSED

  prod:
    mode: production
    workspace:
      # One copy, owned by the deploying service principal: not writable by other workspace users.
      root_path: /Workspace/Users/${var.service_principal_id}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal_id}
    variables:
      catalog: registry
      pause_status: UNPAUSED
