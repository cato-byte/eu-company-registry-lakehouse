name: ci

on:
  pull_request:
  workflow_call:  # pushes to main run it through cd.yml, as the gate before any deployment
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABRICKS_CLI_VERSION: "1.20.0"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the full history

      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pip install -e ".[local,ingestion,dev]"

      - name: Lint (ruff + PySpark anti-patterns + sensitive data)
        run: |
          ruff check src tests tools
          python tools/spark_lint.py src
          git ls-files | xargs python tools/check_sensitive.py

      # Tests use an editable install, which reads data files from src/. Test the artifact itself:
      # a clean virtualenv outside the checkout, with only the wheel's own dependencies (serverless
      # provides pyspark).
      - name: Build the wheel and smoke-test it outside the checkout
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-venv/bin/python" "$GITHUB_WORKSPACE/tools/wheel_smoke.py"
          cd "$GITHUB_WORKSPACE/dist" && sha256sum ./*.whl > SHA256SUMS && cat SHA256SUMS

      - name: Upload the wheel and its checksum
        uses: actions/upload-artifact@v4
        with:
          name: registry-lakehouse-wheel
          path: dist/
          if-no-files-found: error

      - uses: databricks/setup-cli@main
        with:
          version: ${{ env.DATABRICKS_CLI_VERSION }}

      - name: Databricks bundle (strict validation of dev and prod, no workspace needed)
        run: python tools/bundle_check.py databricks

      - name: Unit tests
        run: pytest tests -m "not e2e" --cov=registry_lakehouse --cov-report=term-missing

      - name: End-to-end pipeline on synthetic fixtures
        run: pytest tests -m e2e

      - name: Cost estimate for a full production run (priors)
        run: registry-cost estimate --sizes FR=9.3GB,GB=2.6GB,IE=184MB,NO=2.8GB,EE=92MB,ES=69MB
