# The pipeline as one Lakeflow (Databricks) job on serverless compute, run monthly.
#
#   detect_changes -> has_changes? --no--> (run ends: nothing new, nothing paid)
#                          |yes
#                          +-> bronze (changed countries) -> silver (changed countries) --+
#                          +-> reference (gazetteer) -------------------------------------+-> geo -> gold -> publish
#                                                                                                       \-> cost_report
# Each stage also skips itself when its inputs are unchanged (ops.stage_state).
#
# Guard rails:
#   * timeout_seconds per task and per job: a stuck task is killed, not billed for hours
#   * health rule + on_duration_warning_threshold_exceeded: alert well before the timeout
#   * max_concurrent_runs: 1, so a slow run never overlaps the next scheduled one
#   * performance_target STANDARD: serverless cost-optimised mode (slower start, cheaper)
#   * no automatic retries: a failure e-mails alert_email, is fixed and redeployed, then the next
#     run resumes from the failed stage (detect_changes sees which stages are behind their inputs)

resources:
  jobs:
    registry_lakehouse:
      name: registry-lakehouse-${bundle.target}
      description: Pan-European company registry lakehouse (six national registers -> map-ready gold tables)
      tags:
        project: eu-company-registry-lakehouse
        layer: batch

      schedule:
        # Monthly, on the 6th at 04:00: after the monthly downloads (FR 2nd, GB/IE 3rd, ES 5th).
        quartz_cron_expression: "0 0 4 6 * ?"
        timezone_id: Europe/Paris
        pause_status: ${var.pause_status}
      # Event-driven alternative: run only when the ingestion Lambda lands a new snapshot.
      # trigger:
      #   pause_status: ${var.pause_status}
      #   file_arrival:
      #     url: ${var.landing_root}/

      max_concurrent_runs: 1
      timeout_seconds: 10800
      performance_target: STANDARD
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 5400
      email_notifications:
        on_failure: [ "${var.alert_email}" ]
        on_duration_warning_threshold_exceeded: [ "${var.alert_email}" ]
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: false

      environments:
        - environment_key: default
          spec:
            environment_version: "4"  # Spark 4 / Python 3.12, same as the local test stack
            dependencies:
              - ../dist/*.whl

      tasks:
        # Gate: compare landing / reference / geocoding inputs with what was last processed.
        # Unchanged data -> everything below is skipped and the run costs one small task.
        - task_key: detect_changes
          environment_key: default
          timeout_seconds: 900
          python_wheel_task:
            package_name: registry_lakehouse
            entry_point: registry-lakehouse
            parameters: [ "detect-changes", "--catalog", "${var.catalog}", "--landing-root", "${var.landing_root}",
                          "--run-id", "{{job.run_id}}" ]

        - task_key: has_changes
          depends_on: [ { task_key: detect_changes } ]
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.detect_changes.values.run}}"
            right: "true"

        - task_key: bronze
          depends_on: [ { task_key: has_changes, outcome: "true" } ]
          for_each_task:
            inputs: "{{tasks.detect_changes.values.countries}}"  # only registers with a new snapshot
            concurrency: 3
            task:
              task_key: bronze_country
              environment_key: default
              timeout_seconds: 3600
              max_retries: 0  # failures alert and are rerun by hand, see docs/operations.md
              python_wheel_task:
                package_name: registry_lakehouse
                entry_point: registry-lakehouse
                parameters: [ "bronze", "--country", "{{input}}", "--catalog", "${var.catalog}",
                              "--landing-root", "${var.landing_root}", "--run-id", "{{job.run_id}}",
                              "--secret-scope", "${var.secret_scope}" ]

        - task_key: silver
          depends_on: [ { task_key: bronze } ]
          for_each_task:
            inputs: "{{tasks.detect_changes.values.countries}}"  # only registers with a new snapshot
            concurrency: 1  # all countries MERGE into silver.company: one at a time avoids commit conflicts
            task:
              task_key: silver_country
              environment_key: default
              timeout_seconds: 3600
              max_retries: 0  # a data-quality failure must stop the run, not be retried
              python_wheel_task:
                package_name: registry_lakehouse
                entry_point: registry-lakehouse
                parameters: [ "silver", "--country", "{{input}}", "--catalog", "${var.catalog}",
                              "--landing-root", "${var.landing_root}", "--run-id", "{{job.run_id}}",
                              "--secret-scope", "${var.secret_scope}" ]

        - task_key: reference
          depends_on: [ { task_key: has_changes, outcome: "true" } ]
          environment_key: default
          timeout_seconds: 900
          python_wheel_task:
            package_name: registry_lakehouse
            entry_point: registry-lakehouse
            parameters: [ "reference", "--catalog", "${var.catalog}", "--landing-root", "${var.landing_root}" ]

        - task_key: geo
          depends_on: [ { task_key: silver }, { task_key: reference } ]
          environment_key: default
          timeout_seconds: 1800
          python_wheel_task:
            package_name: registry_lakehouse
            entry_point: registry-lakehouse
            parameters: [ "geo", "--catalog", "${var.catalog}", "--landing-root", "${var.landing_root}",
                          "--run-id", "{{job.run_id}}", "--geocode-batch", "700" ]

        - task_key: gold
          depends_on: [ { task_key: geo } ]
          environment_key: default
          timeout_seconds: 1800
          python_wheel_task:
            package_name: registry_lakehouse
            entry_point: registry-lakehouse
            parameters: [ "gold", "--catalog", "${var.catalog}", "--landing-root", "${var.landing_root}" ]

        - task_key: publish
          depends_on: [ { task_key: gold } ]
          environment_key: default
          timeout_seconds: 600
          python_wheel_task:
            package_name: registry_lakehouse
            entry_point: registry-lakehouse
            parameters: [ "publish", "--catalog", "${var.catalog}", "--landing-root", "${var.landing_root}",
                          "--publish-root", "${var.publish_root}", "--run-id", "{{job.run_id}}" ]

        - task_key: cost_report
          depends_on: [ { task_key: publish } ]
          run_if: ALL_DONE  # cost is worth recording for failed runs too
          environment_key: default
          timeout_seconds: 600
          python_wheel_task:
            package_name: registry_lakehouse
            entry_point: registry-lakehouse
            parameters: [ "cost-report", "--catalog", "${var.catalog}", "--landing-root", "${var.landing_root}" ]
