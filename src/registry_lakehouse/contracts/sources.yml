# Source data contracts.
#
# One entry per national register. The bronze loader validates every landing file against
# its contract *before* reading it (schema drift detection), and every column is landed
# as STRING: parsing happens in silver, where failures become data-quality findings
# instead of job crashes.
#
#   drift_policy:
#     strict  -> any added/removed/renamed column fails the run
#     additive -> new columns are allowed (kept in _rescued_data), removed/renamed fail
#   grain: LEGAL_ENTITY or ESTABLISHMENT (France and Navarra publish establishments)
#   pii_columns: dropped at bronze (data minimisation), never reach the lakehouse.

sources:
  FR:
    country: FRANCE
    register: INSEE SIRENE (StockEtablissement)
    id_column: siret
    format: csv
    delimiter: ","
    encoding: UTF-8
    grain: ESTABLISHMENT
    cadence: monthly
    drift_policy: additive
    pii_columns: []
    columns: [siren, nic, siret, statutDiffusionEtablissement, dateCreationEtablissement,
      trancheEffectifsEtablissement, anneeEffectifsEtablissement,
      activitePrincipaleRegistreMetiersEtablissement, dateDernierTraitementEtablissement,
      etablissementSiege, nombrePeriodesEtablissement, complementAdresseEtablissement,
      numeroVoieEtablissement, indiceRepetitionEtablissement, dernierNumeroVoieEtablissement,
      indiceRepetitionDernierNumeroVoieEtablissement, typeVoieEtablissement,
      libelleVoieEtablissement, codePostalEtablissement, libelleCommuneEtablissement,
      libelleCommuneEtrangerEtablissement, distributionSpecialeEtablissement,
      codeCommuneEtablissement, codeCedexEtablissement, libelleCedexEtablissement,
      codePaysEtrangerEtablissement, libellePaysEtrangerEtablissement,
      identifiantAdresseEtablissement, coordonneeLambertAbscisseEtablissement,
      coordonneeLambertOrdonneeEtablissement, complementAdresse2Etablissement,
      numeroVoie2Etablissement, indiceRepetition2Etablissement, typeVoie2Etablissement,
      libelleVoie2Etablissement, codePostal2Etablissement, libelleCommune2Etablissement,
      libelleCommuneEtranger2Etablissement, distributionSpeciale2Etablissement,
      codeCommune2Etablissement, codeCedex2Etablissement, libelleCedex2Etablissement,
      codePaysEtranger2Etablissement, libellePaysEtranger2Etablissement, dateDebut,
      etatAdministratifEtablissement, enseigne1Etablissement, enseigne2Etablissement,
      enseigne3Etablissement, denominationUsuelleEtablissement, activitePrincipaleEtablissement,
      nomenclatureActivitePrincipaleEtablissement, caractereEmployeurEtablissement,
      activitePrincipaleNAF25Etablissement]

  GB:
    country: UNITED_KINGDOM
    register: Companies House Basic Company Data
    id_column: CompanyNumber
    format: csv
    delimiter: ","
    encoding: UTF-8
    grain: LEGAL_ENTITY
    cadence: monthly
    drift_policy: additive
    pii_columns: []
    columns: [CompanyName, CompanyNumber, RegAddress.CareOf, RegAddress.POBox,
      RegAddress.AddressLine1, RegAddress.AddressLine2, RegAddress.PostTown, RegAddress.County,
      RegAddress.Country, RegAddress.PostCode, CompanyCategory, CompanyStatus, CountryOfOrigin,
      DissolutionDate, IncorporationDate, Accounts.AccountRefDay, Accounts.AccountRefMonth,
      Accounts.NextDueDate, Accounts.LastMadeUpDate, Accounts.AccountCategory,
      Returns.NextDueDate, Returns.LastMadeUpDate, Mortgages.NumMortCharges,
      Mortgages.NumMortOutstanding, Mortgages.NumMortPartSatisfied, Mortgages.NumMortSatisfied,
      SICCode.SicText_1, SICCode.SicText_2, SICCode.SicText_3, SICCode.SicText_4,
      LimitedPartnerships.NumGenPartners, LimitedPartnerships.NumLimPartners, URI,
      PreviousName_1.CONDATE, PreviousName_1.CompanyName, PreviousName_2.CONDATE,
      PreviousName_2.CompanyName, PreviousName_3.CONDATE, PreviousName_3.CompanyName,
      PreviousName_4.CONDATE, PreviousName_4.CompanyName, PreviousName_5.CONDATE,
      PreviousName_5.CompanyName, PreviousName_6.CONDATE, PreviousName_6.CompanyName,
      PreviousName_7.CONDATE, PreviousName_7.CompanyName, PreviousName_8.CONDATE,
