      tvangsopplostPgaManglendeRegnskapDato, tvangsopplostPgaMangelfulltStyreDato,
      fravalgRevisjonDato, fravalgRevisjonBeslutningsDato, maalform, vedtektsdato,
      vedtektsfestetFormaal, aktivitet, overordnetEnhet, slettedato, erIKonsern, kapital,
      paategninger, frivilligMvaRegistrertBeskrivelser, foretaksformIHjemlandet,
      underlagtLovgivningLand, underlagtLovgivningLandKode, registreringsnummerIHjemlandet,
      utenlandskRegisterNavn, utenlandskRegisterAdresse, links, respons_klasse,
      epostadresse, telefon, mobil, hjemmeside]
