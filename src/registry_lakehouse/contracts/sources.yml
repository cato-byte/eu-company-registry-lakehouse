      institusjonellSektorkode, registrertIForetaksregisteret, registreringsdatoForetaksregisteret,
      registrertIStiftelsesregisteret, registrertIFrivillighetsregisteret,
      registreringsdatoFrivillighetsregisteret, registrertIPartiregisteret,
      registreringsdatoPartiregisteret, sisteInnsendteAarsregnskap, konkurs, konkursdato,
      underAvvikling, underAvviklingDato, underTvangsavviklingEllerTvangsopplosning,
