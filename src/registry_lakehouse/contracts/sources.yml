      nombre_cmun, codigo_entidad, denominacion_entidad, tramo_asal, cnae09_ppal,
      cnae09_descrip_ppal, cnae09_local, cnae09_descrip_local]

  "NO":  # quoted: bare NO is a YAML boolean
    country: NORWAY
    register: Bronnoysund Enhetsregisteret
    # The register publishes one 2.8 GB pretty-printed JSON array. The ingestion Lambda
    # rewrites it as newline-delimited JSON parts so Spark can split the work.
    id_column: organisasjonsnummer
    format: ndjson
    encoding: UTF-8
    grain: LEGAL_ENTITY
    cadence: daily
    drift_policy: additive
    # Contact details are not needed for a location/industry map: never stored.
    pii_columns: [epostadresse, telefon, mobil, hjemmeside]
    # JSON keys are optional per record, so drift is checked on the union of keys seen.
    required_columns: [organisasjonsnummer, navn, organisasjonsform]
    columns: [organisasjonsnummer, navn, organisasjonsform, historiskeNavn, postadresse,
      registreringsdatoEnhetsregisteret, registrertIMvaregisteret, naeringskode1, naeringskode2,
